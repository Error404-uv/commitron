[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commitron"
version = "1.0.0rc3"
description = "A safer AI-powered Git assistant for the command line"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Error404-uv" }]
urls = { Homepage = "https://github.com/Error404-uv/commitron", Repository = "https://github.com/Error404-uv/commitron", Issues = "https://github.com/Error404-uv/commitron/issues" }
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["rich>=13.7,<15"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "coverage>=7,<8", "ruff>=0.6,<1"]
secure-store = ["keyring>=25,<27"]

[project.scripts]
commitron = "commitron.cli:main"
smart-commit = "commitron.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
